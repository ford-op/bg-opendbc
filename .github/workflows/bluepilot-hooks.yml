# BluePilot: fail a PR to bg-clean whose merge result leaves an upstream file differing from master
# without being on .github/bluepilot-hooks.txt (spec: #47). Required on bg-clean as `bluepilot-hooks`:
# keep the job name, and keep it running on every PR (a required check that doesn't run blocks the PR).
name: bluepilot hooks

on:
  pull_request:
    branches:
      - bg-clean

permissions:
  contents: read

jobs:
  bluepilot-hooks:
    name: bluepilot-hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master
    - run: python3 .github/bluepilot_hooks.py origin/master
